; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages 
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini_lite]
platform = espressif8266
monitor_speed = 9600
board = d1_mini_lite
framework = arduino
extra_scripts = pre:extra_script.py
; Flash layout (pick one — must USB-flash once after changing):
;   4M1M  — 4MB D1 mini: ~1019KB OTA + 1MB FS (matches .vscode/arduino.json)
;   1M    — 1MB lite, no FS: ~502KB OTA (config on flash won't persist)
;   1M64  — 1MB lite default: ~470KB OTA + 64KB FS (firmware must stay under ~470KB)
board_build.flash_size = 4Mpda
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
	-Os
	-DBEARSSL_SSL_BASIC
	-Wl,--gc-sections
	-ffunction-sections
	-fdata-sections
lib_deps = 
	bblanchon/ArduinoJson@^6.16.1
	sensirion/arduino-sht@^1.1.0
	C:\libarduino\analog
	https://github.com/minolta/espds18b20.git
	milesburton/DallasTemperature@^3.9.1
	https://github.com/ThingPulse/esp8266-oled-ssd1306
	git+https://github.com/minolta/ESPConfigfile.git
	ottowinter/ESPAsyncWebServer-esphome@^3.0.0
	git@github.com:minolta/apmode.git
	mandulaj/PZEM-004T-v30@^1.1.2
	mikalhart/TinyGPSPlus @ ^1.0.3
	https://github.com/minolta/moveavg.git
	smougenot/TM1637@0.0.0-alpha+sha.9486982048
	crankyoldgit/IRremoteESP8266@^2.8.6

